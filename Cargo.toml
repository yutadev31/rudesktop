[workspace]
resolver = "3"
members = ["crates/cpst", "crates/desktop-icons", "crates/rubar", "crates/rumenu", "crates/shell-surface", "crates/shot"]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
arboard = { version = "3.6", features = ["wayland-data-control"] }
chrono = {
  version = "0.4",
  default-features = false,
  features = [
    "clock",
    "std",
  ]
}
chrono-tz = { version = "0.10", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
cosmic-text = "0.19"
crossterm = "0.29"
desktop-icons.path = "crates/desktop-icons"
dirs = "7"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
libpulse-binding = "2.30"
memmap2 = "0.9"
resvg = "0.48.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-surface.path = "crates/shell-surface"
socket2 = "0.6"
tempfile = "3"
thiserror = "2"
tiny-skia = "0.12"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-segmentation = "1"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
windows-sys = "0.61"
x11rb = "0.14"
xkbcommon = { version = "0.9", features = ["wayland"] }
zbus = {
  version = "5",
  default-features = false,
  features = [
    "async-io",
    "blocking-api",
  ]
}
